name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-tauri:
    name: Publish Windows release
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, 2026-07-14
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch ExifTool
        shell: pwsh
        run: ./scripts/fetch-exiftool.ps1

      - name: Sync version from tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          node scripts/set-version.mjs $version

      - name: Verify application version
        run: pnpm version:check
        env:
          CHECK_RELEASE_TAG: "1"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_V3 }}
        with:
          tagName: v__VERSION__
          releaseName: 'LiteExif v__VERSION__'
          releaseBody: |
            LiteExif v__VERSION__ 现已发布。

            ## 本次更新
            - 请查看提交记录了解本次修复与改进。

            ## 下载
            - Windows：在下方 Assets 区域下载 `LiteExif___VERSION___x64-setup.exe`（NSIS 安装包）。

            ---

            LiteExif v__VERSION__ is now available.

            ## What's changed
            - See the commit history for the fixes and improvements in this release.

            ## Downloads
            - Windows: download `LiteExif___VERSION___x64-setup.exe` (NSIS installer) from the Assets section below.

            已安装旧版本的用户会在启动后收到自动更新提示，可直接升级到最新版。
          releaseDraft: false
          prerelease: false
